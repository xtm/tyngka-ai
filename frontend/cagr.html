<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tyngka - CAGR Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Tyngka</h1>

        <p class="subtitle">
            Compound Annual Growth Rate Calculator
        </p>

        <section class="calculator">

            <h2>CAGR Calculator</h2>

            <label for="beginning-value">
                Beginning Value
            </label>

            <input
                id="beginning-value"
                type="number"
                value="100000"
                min="1"
            >

            <label for="ending-value">
                Ending Value
            </label>

            <input
                id="ending-value"
                type="number"
                value="200000"
                min="1"
            >

            <label for="years">
                Investment Period (Years)
            </label>

            <input
                id="years"
                type="number"
                value="10"
                min="1"
                max="100"
                step="1"
            >

            <button id="calculate-cagr-button">
                Calculate
            </button>

            <div id="cagr-result" class="result"></div>

        </section>

        <p>
            <a href="index.html">← Back to calculators</a>
        </p>

    </main>

    <script src="cagr.js"></script>

</body>
</html>
